<!doctype html>
<html lang="pt-PT">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab 8 | Loja Online</title>
        <link rel="stylesheet" href="../shared.css">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <header>
            <a id="link-inicio" href="../index.html"><span aria-hidden="true">←</span> Voltar</a>
            <h1>Loja Online DEISI</h1>

            <nav>
                <ul>
                    <li><a href="#produtos">Produtos</a></li>
                    <li><a href="amigos.html">API Amigos</a></li>
                </ul>
            </nav>

            <button id="botao-cesto" type="button" aria-expanded="false" aria-controls="painel-cesto" aria-label="Abrir cesto de compras">
                <span aria-hidden="true">🛒</span>
                <span>Cesto</span>
                <span id="quantidade-cesto" aria-live="polite">0</span>
            </button>
        </header>

        <!-- Painel do cesto -->
        <dialog id="painel-cesto" aria-labelledby="titulo-cesto">
            <div class="cesto-cabecalho">
                <h2 id="titulo-cesto">O teu cesto</h2>
                <button id="botao-fechar-cesto" type="button" aria-label="Fechar cesto">Fechar</button>
            </div>
            <div id="produtos-selecionados">
                <p id="cesto-vazio">O cesto está vazio.</p>
            </div>
            <p>Total: <span id="total-cesto">0,00 €</span></p>
            <form id="form-checkout">
                <h3>Finalizar compra</h3>
                <label><input id="estudante" type="checkbox"> Sou estudante</label>
                <label for="cupao">Cupão</label>
                <input id="cupao" name="coupon" autocomplete="off">
                <button type="submit">Comprar</button>
                <p id="estado-checkout" role="status" aria-live="polite"></p>
            </form>
        </dialog>

        <main>
            <!-- Lista de produtos -->
            <section id="produtos">
                <h2>Produtos</h2>
                <div class="filtros">
                    <div class="filtro-campo filtro-pesquisa">
                        <label for="pesquisa-produto">Pesquisar produtos</label>
                        <input id="pesquisa-produto" type="search" placeholder="Nome do produto">
                    </div>

                    <div class="filtro-campo">
                        <label for="filtro-categoria">Categoria</label>
                        <select id="filtro-categoria">
                            <option value="">Todas as categorias</option>
                        </select>
                    </div>

                    <div class="filtro-campo">
                        <label for="ordenacao-preco">Ordenar por preço</label>
                        <select id="ordenacao-preco">
                            <option value="">Sem ordenação</option>
                            <option value="asc">Preço crescente</option>
                            <option value="desc">Preço decrescente</option>
                        </select>
                    </div>
                </div>
                <p id="estado-produtos" role="status" aria-live="polite"></p>
                <div id="produtos-list"></div>
            </section>

        </main>

        <footer>2026, ULusófona</footer>

        <script src="main.js"></script>
    </body>
</html>
